services:
  db:
    image: postgres:14.2
    container_name: DataForgeDB
    hostname: DataForgeDB
    restart: unless-stopped
    networks:
      harbor_net:
    ports:
      - "5432:5432"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./postgresql/data:/var/lib/postgresql/data
      - ./postgresql/conf/postgresql.conf:/etc/postgresql/postgresql.conf
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    environment:
      POSTGRES_DB: data_forge
      # 请务必修改密码
      POSTGRES_USER: data_forge
      POSTGRES_PASSWORD: data_forge_2590

  server:
    image: llm_server_py313_env:1.0.0
    container_name: DataForgeServer
    hostname: DataForgeServer
    restart: unless-stopped
    privileged: true
    working_dir: /app
    command: bash -c "python -m serve"
    networks:
      harbor_net:
    ports:
      - "25702:25702"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data:/app/data
      - ./database:/app/database
      - ./logs:/app/logs
      - ./database_models:/app/database_models
      - ./agent:/app/agent
      - ./app_data_gen:/app/app_data_gen
      - ./app_table_gen:/app/app_table_gen
      - ./cruds:/app/cruds
      - ./common:/app/common
      - ./server:/app/server
      - ./utils:/app/utils
      - ./config.py:/app/config.py
      - ./serve.py:/app/serve.py
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      # 日志级别
      - LOG_LEVEL=INFO
      - SQLALCHEMY_ECHO=0
      # 数据默认保留时间
      - DATA_EXPIRED_DAY=30
      # 部署环境的服务器IP
      - SERVER_HOST=10.1.2.132
      - SERVER_PORT=25702
      - APOLLO_WEB_IP=172.21.5.130
      - APOLLO_WEB_PORT=8070
      - INNER_DB_HOST=DataForgeDB

  data_gen_chat:
    image: llm_server_py313_env:1.0.0
    container_name: DFDataGenApp
    hostname: DFDataGenApp
    restart: unless-stopped
    privileged: true
    working_dir: /app
    command: bash -c "python -m app_data_gen.run"
    networks:
      harbor_net:
    ports:
      - "9801:9801"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data:/app/data
      - ./database:/app/database
      - ./logs:/app/logs
      - ./database_models:/app/database_models
      - ./agent:/app/agent
      - ./app_data_gen:/app/app_data_gen
      - ./cruds:/app/cruds
      - ./common:/app/common
      - ./utils:/app/utils
      - ./config.py:/app/config.py
      - ./.env:/app/.env
      - ./.chainlit:/app/.chainlit
    environment:
      - TZ=Asia/Shanghai
      # 日志级别
      - LOG_LEVEL=INFO
      - SQLALCHEMY_ECHO=0
      # 数据默认保留时间
      - DATA_EXPIRED_DAY=30
      - INNER_DB_HOST=DataForgeDB

  table_gen_chat:
