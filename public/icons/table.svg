    <line x1="4" y1="10" x2="20" y2="10" stroke-width="1.5"/>
    <line x1="4" y1="12" x2="20" y2="12" stroke-width="1.5"/>
    <line x1="4" y1="14" x2="20" y2="14" stroke-width="1.5"/>
    <line x1="4" y1="16" x2="20" y2="16" stroke-width="1.5"/>
    <!-- 列分隔线 -->
    <line x1="8" y1="6" x2="8" y2="18" stroke-width="1.5"/>
    <line x1="12" y1="6" x2="12" y2="18" stroke-width="1.5"/>
